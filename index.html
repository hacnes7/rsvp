<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSVP CHEMFEST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
</head>
<body class="flex items-center justify-center p-4">

    <script src="script.js"></script>

    <!-- Background Elements -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <!-- Bats -->
        <div class="text-4xl bat-animated">🦇</div>
        <div class="text-3xl bat-animated bat-2">🦇</div>
        <div class="text-5xl bat-animated bat-3">🦇</div>

        <!-- Cobwebs -->
        <svg class="cobweb cobweb-tl" viewBox="0 0 100 100">
            <path d="M0,0 L100,0 L0,100 Z" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M0,0 L100,100" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M0,0 L50,100" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M0,20 Q20,20 20,0 M0,40 Q40,40 40,0 M0,60 Q60,60 60,0 M0,80 Q80,80 80,0" fill="none" stroke="#fff" stroke-width="1"/>
        </svg>
        <svg class="cobweb cobweb-tr" viewBox="0 0 100 100">
            <path d="M0,0 L100,0 L0,100 Z" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M0,0 L100,100" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M0,0 L50,100" fill="none" stroke="#fff" stroke-width="1"/>
            <path d="M0,20 Q20,20 20,0 M0,40 Q40,40 40,0 M0,60 Q60,60 60,0 M0,80 Q80,80 80,0" fill="none" stroke="#fff" stroke-width="1"/>
        </svg>

        <!-- Floating objects -->
        <div class="absolute bottom-10 left-10 text-6xl floating glow-text drop-shadow-2xl z-10">🎃</div>
        <div class="absolute top-20 right-20 text-5xl floating-delayed drop-shadow-2xl z-10 opacity-70">👻</div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 w-full max-w-md">
        
        <!-- Form Container -->
        <div id="rsvp-container" class="glass-panel rounded-2xl p-8 relative overflow-hidden text-center transition-all duration-500">
            
            <h1 class="font-spooky text-5xl mb-2 text-[#ff7a00] glow-text flicker-anim tracking-wider">CHEMFEST</h1>
            <p class="text-gray-300 mb-8 font-semibold italic text-sm">Berani datang ke perayaan kami?</p>

            <form id="rsvp-form" class="space-y-6 text-left">
                <!-- Nama Field -->
                <div>
                    <label for="nama" class="block text-sm font-bold text-[#8b00ff] mb-2 uppercase tracking-wider">Nama Jiwa</label>
                    <input type="text" id="nama" name="nama" required placeholder="Siapa namamu..." 
                           class="h-input w-full rounded-lg px-4 py-3 text-lg placeholder-gray-500">
                </div>

                <!-- NIM Field -->
                <div>
                    <label for="nim" class="block text-sm font-bold text-[#8b00ff] mb-2 uppercase tracking-wider">Nomor Identitas (NIM)</label>
                    <input type="text" id="nim" name="nim" required placeholder="Cetak nomor kutukanmu..." 
                           class="h-input w-full rounded-lg px-4 py-3 text-lg placeholder-gray-500">
                </div>

                <!-- Kehadiran Field -->
                <div class="pt-4">
                    <label class="block text-sm font-bold text-[#ff7a00] mb-4 uppercase tracking-wider">Keputusan Kehadiran</label>
                    
                    <label class="radio-container">Pasti Datang! 🧛‍♂️
                        <input type="radio" checked="checked" name="kehadiran" value="pasti_datang">
                        <span class="checkmark"></span>
                    </label>
                    
                    <label class="radio-container">Takut... 🧟‍♂️
                        <input type="radio" name="kehadiran" value="takut">
                        <span class="checkmark"></span>
                    </label>
                </div>

                <!-- Error Message Display -->
                <div id="error-msg" class="hidden text-red-500 text-sm mt-2 text-center bg-red-900/30 p-2 rounded"></div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="btn-spooky font-spooky text-2xl w-full rounded-lg py-3 mt-6 text-white tracking-widest relative overflow-hidden group">
                    <span class="relative z-10">Kirim Mantra</span>
                    <!-- Button loading spinner -->
                    <span id="loading-spinner" class="hidden absolute inset-0 flex items-center justify-center bg-purple-900/80 z-20">
                        <svg class="animate-spin h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="glass-panel rounded-2xl p-10 text-center relative overflow-hidden">
            <div class="text-7xl floating mb-6">🦇👻🦇</div>
            <h2 class="font-spooky text-4xl mb-4 text-[#8b00ff] glow-text-purple">Mantra Berhasil Dikirim!</h2>
            <p class="text-xl text-gray-200">
                Sampai jumpa di malam perayaan... <br>
                <span class="text-[#ff7a00] font-bold text-lg mt-2 inline-block flicker-anim">Jangan lihat ke belakang!</span>
            </p>
        </div>

    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // DOM Elements
        const form = document.getElementById('rsvp-form');
        const rsvpContainer = document.getElementById('rsvp-container');
        const successMessage = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');
        const loadingSpinner = document.getElementById('loading-spinner');
        const errorMsg = document.getElementById('error-msg');

        let db, auth;
        let isFirebaseReady = false;

        // Extract Global Variables safely
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-halloween-app';
        let firebaseConfig = null;
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            }
        } catch (e) {
            console.warn("Could not parse firebase config. Using mock mode.", e);
        }

        async function initFirebase() {
            if (!firebaseConfig) {
                console.log("No Firebase config found. App will run in UI-only demo mode.");
                isFirebaseReady = false;
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Check for custom token, otherwise anonymous
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                isFirebaseReady = true;
                console.log("Spooky Firebase initialized.");
            } catch (error) {
                console.error("Error initializing spooky Firebase:", error);
                showError("Koneksi ke dunia ghaib gagal. Coba lagi nanti.");
            }
        }

        // Call init on load
        initFirebase();

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            setTimeout(() => {
                errorMsg.classList.add('hidden');
            }, 5000);
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
                loadingSpinner.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                loadingSpinner.classList.add('hidden');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value.trim();
            const nim = document.getElementById('nim').value.trim();
            const kehadiran = document.querySelector('input[name="kehadiran"]:checked').value;

            if (!nama || !nim) {
                showError("Jangan tinggalkan jejak kosong!");
                return;
            }

            setLoading(true);

            // Simulation of network delay for aesthetic if firebase isn't ready
            if (!isFirebaseReady) {
                setTimeout(() => {
                    setLoading(false);
                    showSuccess();
                }, 1500);
                return;
            }

            try {
                // Ensure auth before writing
                if (!auth.currentUser) {
                    throw new Error("Jiwa tidak terautentikasi!");
                }

                // Strict Firebase path rule: artifacts/{appId}/public/data/{collectionName}
                const rsvpCollection = collection(db, 'artifacts', appId, 'public', 'data', 'rsvps');
                
                await addDoc(rsvpCollection, {
                    nama: nama,
                    nim: nim,
                    kehadiran: kehadiran,
                    timestamp: serverTimestamp(),
                    userId: auth.currentUser.uid
                });

                setLoading(false);
                showSuccess();
                
            } catch (error) {
                console.error("Gagal mengirim mantra:", error);
                setLoading(false);
                showError("Gagal mengirim mantra. Kekuatan gelap menghalangi.");
            }
        });

        function showSuccess() {
            // Hide form with fade out
            rsvpContainer.style.opacity = '0';
            rsvpContainer.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                rsvpContainer.style.display = 'none';
                
                // Show success message
                successMessage.style.display = 'block';
                successMessage.style.opacity = '0';
                successMessage.style.transform = 'scale(0.9)';
                
                // Trigger reflow
                void successMessage.offsetWidth;
                
                successMessage.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                successMessage.style.opacity = '1';
                successMessage.style.transform = 'scale(1)';
            }, 500);
        }
    </script>
</body>
</html>
